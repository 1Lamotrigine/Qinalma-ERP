name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MIX_ENV: test
  ELIXIR_VERSION: '1.20.4'
  OTP_VERSION: '29.1.2'

jobs:
  quality:
    name: Качество и тесты
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_USER: pulse
      DB_PASSWORD: pulse
      DB_HOST: localhost
      DB_PORT: '5432'
      SECRET_KEY_BASE: ci_secret_key_base_placeholder_for_tests_only
      TOKEN_SIGNING_SECRET: ci_token_signing_secret_for_tests_only

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Кэш зависимостей
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Зависимости
        run: mix deps.get

      - name: Форматирование
        run: mix format --check-formatted

      - name: Компиляция без предупреждений
        run: mix compile --warnings-as-errors

      - name: Credo
        run: mix credo --strict

      - name: Sobelow
        run: mix sobelow

      - name: Тесты
        run: mix test

  docker:
    name: Сборка образа и проверка запуска
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Собрать образ
        run: docker build -t pulse_web:ci .

      - name: Подготовить .env для проверки
        run: |
          cat > .env <<EOF
          DB_USER=pulse
          DB_PASSWORD=ci_password
          DB_NAME=pulse_dev
          DB_PORT=5434
          SECRET_KEY_BASE=$(head -c 64 /dev/urandom | base64 | tr -d '\n')
          TOKEN_SIGNING_SECRET=$(head -c 32 /dev/urandom | base64 | tr -d '\n')
          CLOAK_KEY=$(head -c 32 /dev/urandom | base64 | tr -d '\n')
          PHX_HOST=localhost
          WEB_PORT=4000
          ADMIN_EMAIL=admin@qinalma.local
          ADMIN_PASSWORD=admin12345678
          PGADMIN_EMAIL=admin@qinalma.local
          PGADMIN_PASSWORD=pgadmin_ci_password
          EOF

      - name: Поднять и проверить приложение
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/sign-in || true)
            if [ "$code" = "200" ]; then echo "Приложение отвечает"; exit 0; fi
            sleep 5
          done
          echo "Приложение не поднялось"; docker compose logs; exit 1

      - name: Остановить
        if: always()
        run: docker compose down -v
